[package]
name = "pflanzengilde-site"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
garden-core = { path = "../garden-core" }
base64 = "0.22"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["DomRect", "DataTransfer", "DragEvent", "FocusOptions", "SvgElement", "PointerEvent", "Blob", "BlobPropertyBag", "console", "HtmlAnchorElement", "Url", "File", "FileList", "History", "HtmlDialogElement", "HtmlInputElement", "HtmlTextAreaElement", "Location", "Navigator", "Response", "ShareData", "Storage", "UrlSearchParams", "Window"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
